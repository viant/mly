pipeline:
  copyConfig:
    action: storage:copy
    expand: true
    source:
      URL: ${appPath}/example/server/etc/config.yaml
    dest:
      URL: /tmp/e2e/config.yaml

  clearLocalRepo:
    action: exec:run
    target: $target
    checkError: true
    commands:
      - rm -rf /tmp/e2e/triton_local_repo

  stop:
    action: process:stop
    target: $target
    input: mly-endly

  start:
    action: process:start
    target: $target
    directory: /tmp/e2e
    checkError: true
    immuneToHangups: true
    command: bash ${appPath}/example/e2e/start-with-pid.sh /tmp/e2e/mly-endly.pid ./mly-endly -c=/tmp/e2e/config.yaml >/tmp/e2e/mly-endly.log 2>&1
    env:
      DEBUG: 'true'
      LD_LIBRARY_PATH: /usr/local/lib

  waitForBoot:
    action: exec:run
    target: $target
    checkError: true
    commands:
      - bash ${appPath}/example/e2e/check-port.sh localhost:8086 30 1s /tmp/e2e/mly-endly.pid
