init:
  modelRepo: ${appPath}/example/e2e/data/triton_model_repository
pipeline:
  stop:
    services:
      action: docker:stop
      images:
        - aerospike-server
        - tritonserver

  start:
    aerospike:
      action: docker:run
      image: 'aerospike/aerospike-server:3.16.0.6'
      name: mly_aero
      ports:
        3000: 3000
        3001: 3001
        3002: 3002

    triton:
      action: docker:run
      name: mly_triton
      image: 'nvcr.io/nvidia/tritonserver:25.02-py3'
      platform: linux/arm64
      port: "8000/tcp"
      ports:
        8000: 8000
        8001: 8001
        8002: 8002
      mount:
        ${modelRepo}: /models
      cmd:
        - tritonserver
        - --model-repository=/models
      entrypoint:
        - /opt/nvidia/nvidia_entrypoint.sh