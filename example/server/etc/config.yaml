Endpoint:
  Port: 8086

models:
  - id: sli_triton
    url: http://localhost:8070
    platform: triton
    triton:
      modelName: sli_2
      timeout: 5
    useDict: true
    debug: false
    datastore: sli_triton
    inputs:
      - name: sa
        wildcard: true
      - name: sl
        wildcard: true
      - name: aux
        wildcard: true
        auxiliary: true
    outputs:
      - name: expand
        dataType: int

  - id: sli_triton_local_fs
    platform: triton
    triton:
      modelName: sli_local
      serverID: triton_grpc_local_fs
    useDict: true
    debug: false
    datastore: sli_triton
    keyfields:
      - sa
      - sl
      - aux
    inputs:
      - name: sa
        wildcard: true
      - name: sl
        wildcard: true
      - name: aux
        wildcard: true
        auxiliary: true
    outputs:
      - name: expand
        dataType: int

  - id: sli_triton_grpc_explicit
    platform: triton
    triton:
      modelName: sli_exp
      serverID: triton_grpc_explicit
    useDict: true
    debug: false
    datastore: sli_triton
    keyfields:
      - sa
      - sl
      - aux
    inputs:
      - name: sa
        wildcard: true
      - name: sl
        wildcard: true
      - name: aux
        wildcard: true
        auxiliary: true
    outputs:
      - name: expand
        dataType: int

  - id: sli_router
    platform: triton
    mode: router
    triton:
      serverID: triton_grpc_explicit
    Router:
      ConfigURL: ${appPath}/example/server/etc/router.yaml
      InputName: routing_id
      Workers: 2
      Global:
        Exists: false
        PredictionReplacements:
          - Name: expand
            Type: int64
            Value: 0
      Output:
        FieldName: model_id
    Datastore: sli_triton
    useDict: true
    Inputs:
      - name: routing_id
        datatype: int64
        wildcard: true
      - name: sl
        datatype: string
        wildcard: true
      - name: sa
        datatype: string
        wildcard: true
      - name: aux
        datatype: string
        auxiliary: true
    Outputs:
      - name: expand
        datatype: int64
      - name: model_id
        datatype: string

    Test:
      SingleBatch: true

  - id: sli_router_global
    platform: triton
    mode: router
    triton:
      serverID: triton_grpc_explicit
    Router:
      ConfigURL: ${appPath}/example/server/etc/router-global.yaml
      InputName: routing_id
      Workers: 2
      Global:
        Exists: true
      Output:
        FieldName: model_id
        GlobalModelOverride: sli_2
    Datastore: sli_triton
    useDict: true
    Inputs:
      - name: routing_id
        datatype: int64
        wildcard: true
      - name: sl
        datatype: string
        wildcard: true
      - name: sa
        datatype: string
        wildcard: true
      - name: aux
        datatype: string
        auxiliary: true
    Outputs:
      - name: expand
        datatype: int64
      - name: model_id
        datatype: string

    Test:
      SingleBatch: true

  - id: ko_triton
    platform: triton
    triton:
      modelName: ko
      serverID: triton_grpc_explicit
    debug: false
    inputs:
      - name: buggy_aux
        auxiliary: true
      - name: i
        dataType: int
    outputs:
      - name: i0_copy
        dataType: int
      - name: i1_copy
        dataType: int

  - id: sli
    url: ${appPath}/example/model/string_lookups_int_model
    useDict: true
    debug: false
    datastore: sli
    keyfields:
      - sa
      - sl
      - aux
      - kf
    test:
      test: true

  - id: slf
    url: ${appPath}/example/model/string_lookups_float_model
    useDict: true
    debug: false
    datastore: slf
    transformer: slft
    inputs:
      - name: sa
      - name: sl
      - name: aux
        auxiliary: true
    test:
      singleBatch: true

  - id: fli
    url: ${appPath}/example/model/float_input_int_model
    useDict: true
    debug: false
    datastore: fli
    inputs:
      - name: fl
        precision: 4

  - id: flinc
    url: ${appPath}/example/model/float_input_int_model
    useDict: false
    debug: false

  - id: vec
    url: ${appPath}/example/model/vectorization_int_model
    useDict: true
    debug: false
    datastore: vec
    inputs:
      - name: tv
        wildcard: true
      - name: sl
      - name: aux
        auxiliary: true
    test:
      test: true

  - id: ll
    url: ${appPath}/example/model/broken_case_v0_5_0_model
    useDict: false
    debug: false
    inputs:
      - name: lookuplayer_input
    test:
      test: true

  - id: ko
    url: ${appPath}/example/model/keyed_out_model
    useDict: false
    debug: false
    test:
      singleBatch: true

  - id: slow
    url: ${appPath}/example/model/slow_model
    useDict: false
    debug: false
    test:
      singleBatch: true

connections:
  - id: localL1
    hostnames: localhost
    port: 3000
    timeout: 300

tritonServers:
  - id: triton_grpc_explicit
    grpcBaseURL: localhost:8101
    grpcConnectParams:
      baseDelayMs: 10
      multiplier: 2
      jitter: 0.1
      maxDelayMs: 150

  # Copies the fixture tree into /tmp; Triton still loads by name from its mount.
  - id: triton_grpc_local_fs
    grpcBaseURL: localhost:8101
    localModelRepository: /tmp/e2e/triton_local_repo
    remoteRepositoryURI: file://${appPath}/example/e2e/data/triton_model_repository
    grpcConnectParams:
      baseDelayMs: 10
      multiplier: 2
      jitter: 0.1
      maxDelayMs: 150

datastores:
  - id: sli_triton
    connection: localL1
    namespace: test
    dataset: sli_triton
    timeToLiveMs: 30000

  - id: sli
    connection: localL1
    namespace: test
    dataset: sli
    timeToLiveMs: 30000

  - id: slf
    connection: localL1
    namespace: test
    dataset: slf
    timeToLiveMs: 30000

  - id: vec
    connection: localL1
    namespace: test
    dataset: vec
    timeToLiveMs: 30000

  - id: fli
    connection: localL1
    namespace: test
    dataset: fli
    timeToLiveMs: 30000
